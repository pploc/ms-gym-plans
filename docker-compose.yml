services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-plans-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: plans_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plans_db"]
      interval: 5s
      timeout: 5s
      retries: 5

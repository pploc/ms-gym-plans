spring:
  application:
    name: ms-gym-plans
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/plans_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

grpc:
  server:
    port: ${GRPC_SERVER_PORT:50051}
    tls:
      # Local default: mTLS with certs/local from ./scripts/generate-local-certs.sh (bootRun ensures).
      # Prod must set PLANS_GRPC_* paths (or mount) and never ship local CA.
      enabled: ${PLANS_GRPC_TLS_ENABLED:true}
      allow-plaintext: ${PLANS_GRPC_ALLOW_PLAINTEXT:false}
      certificate-chain: ${PLANS_GRPC_SERVER_CERT:certs/local/server.crt}
      private-key: ${PLANS_GRPC_SERVER_KEY:certs/local/server.key}
      client-ca: ${PLANS_GRPC_CLIENT_CA:certs/local/ca.crt}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.gym.plans: DEBUG

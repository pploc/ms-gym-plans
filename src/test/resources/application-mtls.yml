spring:
  datasource:
    url: jdbc:h2:mem:plans-mtls;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  flyway:
    enabled: false

grpc:
  server:
    # Fixed port so client tests can dial without reading Server.getPort().
    port: 55051
    tls:
      enabled: true
      allow-plaintext: false
      certificate-chain: certs/local/server.crt
      private-key: certs/local/server.key
      client-ca: certs/local/ca.crt

logging:
  level:
    root: WARN
    com.gym.plans: INFO
